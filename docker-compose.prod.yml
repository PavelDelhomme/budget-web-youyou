version: '3.8'

services:
  # Zone DMZ : Nginx avec WAF
  nginx:
    image: nginx:alpine
    container_name: budget-nginx-dmz
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/waf-rules:/etc/nginx/waf-rules:ro
      - nginx_logs:/var/log/nginx
    networks:
      - dmz-network
      - app-network
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Application Backend (Réseau Privé)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: budget-web-backend
    expose:  # expose au lieu de ports (pas accessible depuis Internet)
      - "6060"
    environment:
      - PORT=6060
      - SECRET_KEY=${SECRET_KEY}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - WAF_BLOCK_MODE=true
      - FLASK_ENV=production
      - FORCE_HTTPS=true
    volumes:
      - ./backend/data:/app/data
    networks:
      - app-network  # Réseau privé uniquement
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6060/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Frontend (Réseau Privé)
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: budget-web-frontend
    expose:  # expose au lieu de ports (pas accessible depuis Internet)
      - "3030"
    environment:
      - VITE_API_URL=https://${DOMAIN:-localhost}
      - VITE_PROXY_TARGET=http://backend:6060
      - VITE_HMR_DISABLED=true
    networks:
      - app-network
    depends_on:
      - backend
    restart: unless-stopped

networks:
  dmz-network:
    driver: bridge
    # Zone DMZ - accessible depuis l'extérieur via Nginx
  app-network:
    driver: bridge
    internal: false  # Permet communication avec DMZ mais pas directement depuis Internet
    # Réseau privé pour l'application

volumes:
  nginx_logs:
    driver: local
