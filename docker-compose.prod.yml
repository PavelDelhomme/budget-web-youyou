services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: budget-web-backend-prod
    ports:
      - "${BACKEND_PORT:-6060}:6060"
    environment:
      - PORT=6060
      - SECRET_KEY=${SECRET_KEY}
      - FLASK_ENV=production
      - DEBUG=False
      - ADMIN_EMAIL=${ADMIN_EMAIL:-dev@delhomme.ovh}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - GUNICORN_WORKERS=${GUNICORN_WORKERS:-4}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    volumes:
      - ./backend/data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6060/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: budget-web-frontend-prod
    ports:
      - "${FRONTEND_PORT:-6061}:3030"
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://localhost:6060}
      - VITE_PROXY_TARGET=http://backend:6060
    volumes:
      - ./client:/app
      - budget-web-frontend_node_modules:/app/node_modules
      - budget-web-frontend_dist:/app/dist
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  budget-web-frontend_node_modules:
  budget-web-frontend_dist:

