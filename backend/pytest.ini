[pytest]
testpaths = tests/backend
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --strict-markers
    --tb=short
    --cov=backend
    --cov-report=term-missing
    --cov-report=html
    --cov-report=xml
    --timeout=30
markers =
    unit: Unit tests
    integration: Integration tests
    security: Security tests
    performance: Performance tests

