<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Budget Annuel</title>
  <!-- Tailwind via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React UMD (production) -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
</head>
<body class="bg-slate-50">
<div id="root"></div>

<!-- Application script -->
<script type="text/javascript">
const { useState, useEffect, useMemo, useRef } = React;

// Utility functions
const today = new Date();
function toISODate(d) {
  if (!d) return "";
  const dt = new Date(d);
  const y = dt.getFullYear();
  const m = String(dt.getMonth() + 1).padStart(2, "0");
  const dd = String(dt.getDate()).padStart(2, "0");
  return `${y}-${m}-${dd}`;
}
function parseAmount(v) {
  const n = Number(String(v).replace(",", "."));
  return Number.isFinite(n) ? Math.round(n * 100) / 100 : 0;
}
const currency = (n) => (n || 0).toLocaleString("fr-FR", { style: "currency", currency: "EUR" });

// API helper
async function api(path, opts={}) {
  const res = await fetch(`/api/${path}`, { credentials: "include", ...opts });
  if (!res.ok) {
    const t = await res.text().catch(() => res.statusText);
    throw new Error(t || res.statusText);
  }
  const ct = res.headers.get("content-type") || "";
  return ct.includes("application/json") ? res.json() : res.text();
}
const Api = {
  login: (email,password) => api('login.php',{ method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({email,password}) }),
  logout: () => api('logout.php',{ method:'POST' }),
  getYears: () => api('years.php'),
  addYear: (year) => api('years.php',{ method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({year}) }),
  deleteYear: (year) => api(`years.php?year=${encodeURIComponent(year)}`, { method:'DELETE' }),
  getYearData: (year) => api(`get.php?year=${encodeURIComponent(year)}`),
  putYearData: (year, payload) => api(`put.php?year=${encodeURIComponent(year)}`, { method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload) }),
};

// Default categories
const defaultCategories = [
  { id:'achats', name:'Achats & Loisirs', target:2400 },
  { id:'alimentation', name:'Alimentation', target:2400 }
];
const INITIAL_YEARS = [2026,2027,2028,2029,2030];

function SummaryCard({ title, value, subtitle }) {
  return (
    React.createElement('div',{ className:'rounded-2xl bg-white shadow p-4 border' },
      React.createElement('div',{ className:'text-xs uppercase tracking-wide text-slate-500' },title),
      React.createElement('div',{ className:'text-2xl font-semibold mt-1' }, value),
      subtitle && React.createElement('div',{ className:'text-xs text-slate-600 mt-2' },subtitle)
    )
  );
}

function App() {
  const [sessionEmail, setSessionEmail] = useState(null);
  const [years, setYears] = useState(INITIAL_YEARS);
  const [year, setYear] = useState(INITIAL_YEARS[0]);

  // Data for the selected year
  const [categories, setCategories] = useState(defaultCategories);
  const [expenses, setExpenses] = useState([]);
  const [subs, setSubs] = useState([]);

  // Forms
  const [loginForm, setLoginForm] = useState({ email:'', password:'' });
  const [expForm, setExpForm] = useState({ date: toISODate(today), amount:'', categoryId: defaultCategories[0].id, note:'' });
  const [subForm, setSubForm] = useState({ name:'', monthly:'', startMonth:1, endMonth:12, ongoing:false });

  // Debounce timer for saving
  const saveTimer = useRef(null);

  // Bootstrap on mount: fetch years and existing session
  useEffect(() => {
    async function init() {
      try {
        const y = await Api.getYears();
        if (Array.isArray(y.years) && y.years.length > 0) {
          setYears(y.years);
          setYear(y.years[0]);
        }
        if (y.email) setSessionEmail(y.email);
      } catch (err) {
        console.warn(err);
      }
    }
    init();
  }, []);

  // Load data when sessionEmail or year changes
  useEffect(() => {
    if (!sessionEmail || !year) return;
    async function load() {
      try {
        const ds = await Api.getYearData(year);
        setCategories(ds.categories && ds.categories.length ? ds.categories : defaultCategories);
        setExpenses(Array.isArray(ds.expenses) ? ds.expenses : []);
        setSubs(Array.isArray(ds.subs) ? ds.subs : []);
        // adjust expense form category
        setExpForm(f => ({ ...f, categoryId: (ds.categories && ds.categories[0]?.id) || defaultCategories[0].id }));
      } catch(err) {
        console.error(err);
      }
    }
    load();
  }, [sessionEmail, year]);

  // Save data when categories, expenses, subs change, with debounce
  useEffect(() => {
    if (!sessionEmail || !year) return;
    if (saveTimer.current) clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(() => {
      Api.putYearData(year, { categories, expenses, subs }).catch(err => console.error('save error', err));
    }, 500);
  }, [categories, expenses, subs, sessionEmail, year]);

  // Derived metrics
  const THIS_YEAR = year;
  const monthNow = useMemo(() => (today.getFullYear() === THIS_YEAR ? today.getMonth() + 1 : 12), [THIS_YEAR]);
  // total variable target
  const variableTargets = useMemo(() => categories.reduce((s,c) => s + parseAmount(c.target), 0), [categories]);
  // spent by category
  const variableSpentByCat = useMemo(() => {
    const m = {};
    for (const c of categories) m[c.id] = 0;
    for (const e of expenses) {
      const amt = parseAmount(e.amount);
      m[e.categoryId] = (m[e.categoryId] || 0) + amt;
    }
    return m;
  }, [categories, expenses]);
  // total spent variables
  const variableSpentTotal = useMemo(() => Object.values(variableSpentByCat).reduce((a,b) => a + b, 0), [variableSpentByCat]);
  // subs commitments
  const monthsOverlapFullYear = (s) => {
    const a = Math.max(1, Math.min(12, s.startMonth || 1));
    const b = s.ongoing || !s.endMonth ? 12 : Math.max(a, Math.min(12, s.endMonth));
    return Math.max(0, b - a + 1);
  };
  const monthsOverlapInYear = (s, upToMonth=12) => {
    const a = Math.max(1, Math.min(12, s.startMonth || 1));
    const b = s.ongoing || !s.endMonth ? 12 : Math.max(a, Math.min(12, s.endMonth));
    const m = Math.max(1, Math.min(12, upToMonth));
    return Math.max(0, Math.min(b, m) - a + 1);
  };
  const subsAnnualCommitted = useMemo(() => subs.reduce((sum,s) => sum + parseAmount(s.monthly) * monthsOverlapFullYear(s), 0), [subs]);
  const subsPaidToDate = useMemo(() => subs.reduce((sum,s) => sum + parseAmount(s.monthly) * monthsOverlapInYear(s, monthNow), 0), [subs, monthNow]);
  const annualBudgetTotal = useMemo(() => variableTargets + subsAnnualCommitted, [variableTargets, subsAnnualCommitted]);
  const spentToDateTotal = useMemo(() => variableSpentTotal + subsPaidToDate, [variableSpentTotal, subsPaidToDate]);
  const remainingYearTotal = useMemo(() => Math.max(0, annualBudgetTotal - spentToDateTotal), [annualBudgetTotal, spentToDateTotal]);
  const variableRemainingByCat = useMemo(() => {
    const m = {};
    for (const c of categories) {
      const spent = variableSpentByCat[c.id] || 0;
      m[c.id] = Math.max(0, parseAmount(c.target) - spent);
    }
    return m;
  }, [categories, variableSpentByCat]);
  const variableRemainingTotal = useMemo(() => Object.values(variableRemainingByCat).reduce((a,b) => a + b, 0), [variableRemainingByCat]);
  const daysInYear = useMemo(() => (new Date(THIS_YEAR,11,31) - new Date(THIS_YEAR,0,0))/(1000*60*60*24), [THIS_YEAR]);
  const dayOfYear = useMemo(() => {
    const d = (today.getFullYear() === THIS_YEAR) ? today : new Date(THIS_YEAR,11,31);
    const start = new Date(THIS_YEAR,0,0);
    return Math.floor((d - start) / (1000*60*60*24));
  }, [THIS_YEAR]);
  const daysRemaining = Math.max(0, Math.floor(daysInYear - dayOfYear));

  // Actions
  function addExpense() {
    const amt = parseAmount(expForm.amount);
    if (!amt) return;
    setExpenses(prev => [
      { id: crypto.randomUUID(), ...expForm, amount: amt, date: expForm.date || toISODate(today) },
      ...prev,
    ]);
    setExpForm(f => ({ ...f, amount:'', note:'' }));
  }
  function removeExpense(id) { setExpenses(prev => prev.filter(e => e.id !== id)); }
  function addSub() {
    const m = parseAmount(subForm.monthly);
    if (!m) return;
    let { startMonth, endMonth, ongoing } = subForm;
    startMonth = Number(startMonth) || 1;
    endMonth = ongoing ? 12 : (Number(endMonth) || 12);
    setSubs(prev => [
      { id: crypto.randomUUID(), name: subForm.name || 'Abonnement', monthly: m, startMonth, endMonth, ongoing },
      ...prev,
    ]);
    setSubForm({ name:'', monthly:'', startMonth:1, endMonth:12, ongoing:false });
  }
  function removeSub(id) { setSubs(prev => prev.filter(s => s.id !== id)); }
  function upsertCategory(id, patch) {
    setCategories(prev => prev.map(c => c.id === id ? { ...c, ...patch, target: parseAmount(patch.target ?? c.target) } : c));
  }
  function addCategory() {
    setCategories(prev => [...prev, { id: crypto.randomUUID(), name:'Nouvelle catégorie', target:0 }]);
  }
  function removeCategory(id) {
    if (expenses.some(e => e.categoryId === id)) {
      alert("Supprimez ou réaffectez d'abord les dépenses de cette catégorie.");
      return;
    }
    setCategories(prev => prev.filter(c => c.id !== id));
  }
  async function onLogin(e) {
    e.preventDefault();
    const { email, password } = loginForm;
    try {
      const out = await Api.login(email,password);
      setSessionEmail(out.email);
      setYears(out.years);
      setYear(out.years[0]);
    } catch(err) {
      alert(err.message || 'Login error');
    }
  }
  async function onLogout() {
    await Api.logout();
    setSessionEmail(null);
  }
  async function onAddYear() {
    const y = prompt("Ajouter l'année (ex: 2031)");
    const num = Number(y);
    if (!num || num < 1900 || num > 2100) return;
    try {
      const out = await Api.addYear(num);
      setYears(out.years);
      setYear(num);
    } catch(err) {
      alert(err.message || 'Erreur ajout année');
    }
  }
  async function onDeleteYear() {
    if (!year) return;
    if (!confirm(`Supprimer l'année ${year} (données incluses) ?`)) return;
    try {
      const out = await Api.deleteYear(year);
      setYears(out.years);
      setYear(out.years[0] || null);
    } catch(err) {
      alert(err.message || 'Erreur suppression année');
    }
  }

  // UI for login
  if (!sessionEmail) {
    return (
      React.createElement('div',{ className:'min-h-screen flex items-center justify-center p-4' },
        React.createElement('form',{ onSubmit:onLogin, className:'bg-white p-6 rounded-2xl shadow w-full max-w-sm space-y-3' },[
          React.createElement('h1',{ key:'title', className:'text-xl font-semibold' },'Connexion'),
          React.createElement('input',{ key:'email', required:true, type:'email', placeholder:'Email', className:'w-full border rounded-xl px-3 py-2', value: loginForm.email, onChange: (e) => setLoginForm(f => ({ ...f, email: e.target.value })) }),
          React.createElement('input',{ key:'pass', required:true, type:'password', placeholder:'Mot de passe', className:'w-full border rounded-xl px-3 py-2', value: loginForm.password, onChange: (e) => setLoginForm(f => ({ ...f, password: e.target.value })) }),
          React.createElement('button',{ key:'submit', className:'w-full bg-black text-white rounded-xl py-2', type:'submit' },'Se connecter'),
          React.createElement('p',{ key:'note', className:'text-xs text-slate-500' },`Astuce : pas d'inscription séparée. Le fichier de données est créé à la première connexion.`)
        ])
      )
    );
  }

  // UI when logged in
  return (
    React.createElement('div',{ className:'min-h-screen bg-slate-50 p-4 md:p-8' },
      React.createElement('div',{ className:'max-w-6xl mx-auto space-y-6' },[
        // Header
        React.createElement('header',{ key:'header', className:'flex flex-col md:flex-row md:items-end md:justify-between gap-3' },[
          React.createElement('div',{ key:'left' },[
            React.createElement('h1',{ className:'text-2xl md:text-3xl font-bold tracking-tight' },`Budget Annuel – ${year}`),
            React.createElement('p',{ className:'text-slate-600' },`Serveur : données liées à ${sessionEmail}`)
          ]),
          React.createElement('div',{ key:'right', className:'flex items-center gap-2' },[
            React.createElement('div',{ className:'flex items-center gap-2' },[
              React.createElement('label',{ className:'text-sm text-slate-600' },'Année'),
              React.createElement('select',{ className:'border rounded-xl px-3 py-2 bg-white shadow-sm', value: year || '', onChange: (e) => setYear(Number(e.target.value)) }, years.map(y => React.createElement('option',{ key:y, value:y },y)))
            ]),
            React.createElement('button',{ className:'px-3 py-2 rounded-xl bg-white border', onClick:onAddYear },'+ Ajouter'),
            React.createElement('button',{ className:'px-3 py-2 rounded-xl bg-white border', onClick:onDeleteYear, disabled:!year },'Supprimer'),
            React.createElement('button',{ className:'px-3 py-2 rounded-xl bg-white border', onClick:onLogout },'Déconnexion')
          ])
        ]),

        // Summary cards
        React.createElement('section',{ key:'summary', className:'grid md:grid-cols-4 gap-4' },[
          React.createElement(SummaryCard,{ title:'Budget annuel (cible)', value:currency(annualBudgetTotal), subtitle:`Variables ${currency(variableTargets)} + Fixes ${currency(subsAnnualCommitted)}` }),
          React.createElement(SummaryCard,{ title:'Dépensé à date', value:currency(spentToDateTotal), subtitle:`Variables ${currency(variableSpentTotal)} + Fixes ${currency(subsPaidToDate)}` }),
          React.createElement(SummaryCard,{ title:'Reste année (tous postes)', value:currency(remainingYearTotal), subtitle:`${daysRemaining} jours restants` }),
          React.createElement(SummaryCard,{ title:'Reste variables', value:currency(variableRemainingTotal), subtitle:`Taux/jour ≈ ${currency(daysRemaining ? (variableRemainingTotal / daysRemaining) : 0)}` }),
        ]),

        // Categories
        React.createElement('section',{ key:'categories', className:'bg-white rounded-2xl shadow p-4 md:p-6 space-y-4' },[
          React.createElement('div',{ key:'title', className:'flex items-center justify-between' },[
            React.createElement('h2',{ className:'font-semibold text-lg' },'Catégories variables & cibles'),
            React.createElement('div',{ className:'flex gap-2' },[
              React.createElement('button',{ className:'px-3 py-2 rounded-xl bg-black text-white text-sm', onClick:addCategory },'+ Ajouter une catégorie')
            ])
          ]),
          React.createElement('div',{ key:'list', className:'grid md:grid-cols-2 gap-3' },
            categories.map(c => React.createElement('div',{ key:c.id, className:'border rounded-2xl p-3 flex items-center justify-between bg-slate-50' },[
              React.createElement('div',{ className:'flex-1 mr-3' },[
                React.createElement('input',{ className:'w-full bg-white border rounded-xl px-3 py-2 mb-2', value:c.name, onChange:(e) => upsertCategory(c.id,{ name:e.target.value }) }),
                React.createElement('div',{ className:'text-xs text-slate-600' },`Dépensé: ${currency(variableSpentByCat[c.id] || 0)} · Reste: ${currency(variableRemainingByCat[c.id] || 0)}`)
              ]),
              React.createElement('div',{ className:'flex items-center gap-2' },[
                React.createElement('label',{ className:'text-sm text-slate-600' },'Cible €'),
                React.createElement('input',{ type:'number', className:'w-28 bg-white border rounded-xl px-3 py-2', value:c.target, onChange:(e) => upsertCategory(c.id,{ target:e.target.value }) }),
                ( () => defaultCategories.some(d => d.id === c.id) ? null : React.createElement('button',{ className:'ml-2 text-sm text-red-600 hover:underline', onClick:() => removeCategory(c.id) },'Supprimer') )()
              ])
            ]))
          )
        ]),

        // Expenses
        React.createElement('section',{ key:'expenses', className:'bg-white rounded-2xl shadow p-4 md:p-6 space-y-4' },[
          React.createElement('h2',{ className:'font-semibold text-lg' },'Ajouter une dépense variable'),
          React.createElement('div',{ className:'grid md:grid-cols-5 gap-3' },[
            React.createElement('div',{ key:'date' },[
              React.createElement('label',{ className:'text-sm text-slate-600' },'Date'),
              React.createElement('input',{ type:'date', className:'w-full border rounded-xl px-3 py-2', value:expForm.date, onChange:(e) => setExpForm(f=>({...f,date:e.target.value})) })
            ]),
            React.createElement('div',{ key:'amt' },[
              React.createElement('label',{ className:'text-sm text-slate-600' },'Montant (€)'),
              React.createElement('input',{ type:'number', className:'w-full border rounded-xl px-3 py-2', placeholder:'0.00', value:expForm.amount, onChange:(e) => setExpForm(f=>({...f,amount:e.target.value})) })
            ]),
            React.createElement('div',{ key:'cat' },[
              React.createElement('label',{ className:'text-sm text-slate-600' },'Catégorie'),
              React.createElement('select',{ className:'w-full border rounded-xl px-3 py-2', value:expForm.categoryId, onChange:(e) => setExpForm(f=>({...f,categoryId:e.target.value})) }, categories.map(c => React.createElement('option',{ key:c.id, value:c.id },c.name)))
            ]),
            React.createElement('div',{ key:'note', className:'md:col-span-2' },[
              React.createElement('label',{ className:'text-sm text-slate-600' },'Note'),
              React.createElement('input',{ className:'w-full border rounded-xl px-3 py-2', placeholder:'ex: courses, concert, achat...', value:expForm.note, onChange:(e) => setExpForm(f=>({...f,note:e.target.value})) })
            ])
          ]),
          React.createElement('div',{ className:'flex justify-end' },[
            React.createElement('button',{ className:'px-4 py-2 rounded-xl bg-black text-white', onClick:addExpense },'Ajouter')
          ]),
          expenses.length > 0 && React.createElement('div',{ className:'mt-4 overflow-x-auto' },
            React.createElement('table',{ className:'min-w-full text-sm' },[
              React.createElement('thead',null,
                React.createElement('tr',{ className:'text-left text-slate-600' },[
                  React.createElement('th',{ className:'py-2 pr-4' },'Date'),
                  React.createElement('th',{ className:'py-2 pr-4' },'Catégorie'),
                  React.createElement('th',{ className:'py-2 pr-4' },'Note'),
                  React.createElement('th',{ className:'py-2 pr-4' },'Montant'),
                  React.createElement('th',null)
                ])
              ),
              React.createElement('tbody',null,
                expenses.map(e => React.createElement('tr',{ key:e.id, className:'border-t' },[
                  React.createElement('td',{ className:'py-2 pr-4' }, toISODate(e.date)),
                  React.createElement('td',{ className:'py-2 pr-4' }, categories.find(c => c.id === e.categoryId)?.name || '—'),
                  React.createElement('td',{ className:'py-2 pr-4 max-w-[300px] truncate', title:e.note }, e.note),
                  React.createElement('td',{ className:'py-2 pr-4' }, currency(e.amount)),
                  React.createElement('td',{ className:'py-2 pr-2 text-right' }, React.createElement('button',{ className:'text-red-600', onClick:() => removeExpense(e.id) }, 'Supprimer'))
                ]))
              )
            ])
          )
        ]),

        // Subscriptions
        React.createElement('section',{ key:'subs', className:'bg-white rounded-2xl shadow p-4 md:p-6 space-y-4' },[
          React.createElement('h2',{ className:'font-semibold text-lg' },'Abonnements (dépenses fixes mensuelles)'),
          React.createElement('div',{ className:'grid md:grid-cols-6 gap-3 items-end' },[
            React.createElement('div',{ className:'md:col-span-2' },[
              React.createElement('label',{ className:'text-sm text-slate-600' },'Nom'),
              React.createElement('input',{ className:'w-full border rounded-xl px-3 py-2', placeholder:'ex: Spotify, Assurance, Téléphone', value:subForm.name, onChange:(e) => setSubForm(f=>({...f,name:e.target.value})) })
            ]),
            React.createElement('div',null,[
              React.createElement('label',{ className:'text-sm text-slate-600' },'Mensuel (€)'),
              React.createElement('input',{ type:'number', className:'w-full border rounded-xl px-3 py-2', placeholder:'0.00', value:subForm.monthly, onChange:(e) => setSubForm(f=>({...f,monthly:e.target.value})) })
            ]),
            React.createElement('div',null,[
              React.createElement('label',{ className:'text-sm text-slate-600' },'Débute (mois)'),
              React.createElement('input',{ type:'number', min:1, max:12, className:'w-full border rounded-xl px-3 py-2', value:subForm.startMonth, onChange:(e) => setSubForm(f=>({...f,startMonth:Number(e.target.value)})) })
            ]),
            React.createElement('div',null,[
              React.createElement('label',{ className:'text-sm text-slate-600' },'Se termine (mois)'),
              React.createElement('input',{ type:'number', min:1, max:12, className:'w-full border rounded-xl px-3 py-2', value:subForm.endMonth, onChange:(e) => setSubForm(f=>({...f,endMonth:Number(e.target.value)})) , disabled:subForm.ongoing })
            ]),
            React.createElement('div',{ className:'flex items-center gap-2' },[
              React.createElement('input',{ id:'ongoing', type:'checkbox', checked:subForm.ongoing, onChange:(e) => setSubForm(f=>({...f,ongoing:e.target.checked})) }),
              React.createElement('label',{ htmlFor:'ongoing', className:'text-sm text-slate-700' },"En cours toute l'année")
            ])
          ]),
          React.createElement('div',{ className:'flex justify-end' },[
            React.createElement('button',{ className:'px-4 py-2 rounded-xl bg-black text-white', onClick:addSub },"Ajouter l'abonnement")
          ]),
          subs.length > 0 && React.createElement('div',{ className:'mt-4 overflow-x-auto' },
            React.createElement('table',{ className:'min-w-full text-sm' },[
              React.createElement('thead',null,
                React.createElement('tr',{ className:'text-left text-slate-600' },[
                  React.createElement('th',{ className:'py-2 pr-4' },'Nom'),
                  React.createElement('th',{ className:'py-2 pr-4' },'Mensuel'),
                  React.createElement('th',{ className:'py-2 pr-4' },'Mois actifs'),
                  React.createElement('th',{ className:'py-2 pr-4' },'Total annuel'),
                  React.createElement('th',{ className:'py-2 pr-4' },'Payé à date'),
                  React.createElement('th',null)
                ])
              ),
              React.createElement('tbody',null,
                subs.map(s => {
                  const monthsFull = (() => {
                    const a = Math.max(1, Math.min(12, s.startMonth || 1));
                    const b = s.ongoing || !s.endMonth ? 12 : Math.max(a, Math.min(12, s.endMonth));
                    return Math.max(0, b - a + 1);
                  })();
                  const monthsToDate = (() => {
                    const a = Math.max(1, Math.min(12, s.startMonth || 1));
                    const b = s.ongoing || !s.endMonth ? 12 : Math.max(a, Math.min(12, s.endMonth));
                    const m = Math.max(1, Math.min(12, monthNow));
                    return Math.max(0, Math.min(b, m) - a + 1);
                  })();
                  return React.createElement('tr',{ key:s.id, className:'border-t' },[
                    React.createElement('td',{ className:'py-2 pr-4' }, s.name),
                    React.createElement('td',{ className:'py-2 pr-4' }, currency(s.monthly)),
                    React.createElement('td',{ className:'py-2 pr-4' }, monthsFull),
                    React.createElement('td',{ className:'py-2 pr-4' }, currency(s.monthly * monthsFull)),
                    React.createElement('td',{ className:'py-2 pr-4' }, currency(s.monthly * monthsToDate)),
                    React.createElement('td',{ className:'py-2 pr-2 text-right' }, React.createElement('button',{ className:'text-red-600', onClick:() => removeSub(s.id) }, 'Supprimer'))
                  ]);
                })
              )
            ])
          )
        ]),

        React.createElement('section',{ key:'note', className:'text-xs text-slate-500 pb-8' },[
          React.createElement('p',null,'Les données sont stockées côté serveur, par utilisateur (email), et chargées/écrites à la volée.')
        ])
      ])
    )
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
</body>
</html>
