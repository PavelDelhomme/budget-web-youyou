services:
  postgres:
    image: postgres:15-alpine
    container_name: budget-web-postgres
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-budget_db}
      - POSTGRES_USER=${POSTGRES_USER:-budget_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-budget_password_change_in_production}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-budget_user} -d ${POSTGRES_DB:-budget_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: budget-web-backend
    ports:
      - "6060:6060"
    environment:
      - PORT=6060
      - SECRET_KEY=${SECRET_KEY:-budget-annuel-secret-key-change-in-production}
      - DEBUG=${DEBUG:-False}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-dev@delhomme.ovh}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-5n!B@#c*ymgEBYXrWdKE}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-budget_user}:${POSTGRES_PASSWORD:-budget_password_change_in_production}@postgres:5432/${POSTGRES_DB:-budget_db}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/data:/app/data
      - ./backend/api:/app/api
      - ./backend/app.py:/app/app.py
      - ./backend/scripts:/app/scripts
      - ./tests:/app/tests
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6060/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: budget-web-frontend
    ports:
      - "6061:3030"
    environment:
      - VITE_API_URL=http://localhost:6060
      - VITE_PROXY_TARGET=http://backend:6060
      - VITE_HMR_DISABLED=true
    volumes:
      - ./client:/app
      - budget-web-frontend_node_modules:/app/node_modules
      - budget-web-frontend_dist:/app/dist
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  budget-web-frontend_node_modules:
  budget-web-frontend_dist:
  postgres_data:

