<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Budget Annuel</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="alternate icon" href="/favicon.ico" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#3b82f6" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Budget" />
  
  <!-- Intercepteur global pour masquer les erreurs 401 et WebSocket AVANT que React ne charge -->
  <script>
    (function() {
      'use strict';
      
      // Sauvegarder les fonctions originales
      const originalError = console.error;
      const originalWarn = console.warn;
      const originalLog = console.log;
      
      // Patterns à ignorer (tous en minuscules pour comparaison)
      const IGNORED_PATTERNS = [
        '401',
        'unauthorized',
        'not authenticated',
        'websocket',
        'ws://',
        'hmr',
        'vite',
        'webpack',
        'failed to connect',
        'connection failed',
        'setupwebsocket',
        'client:536',
        'installhook',
        'failed to connect to websocket',
        'websocket connection to',
        'your current setup',
        'check out your vite',
        'network configuration',
        'server-options',
        'overrideMethod'
      ];
      
      function shouldIgnore(...args) {
        if (!args || args.length === 0) return false;
        
        // Convertir tous les arguments en string et vérifier
        for (const arg of args) {
          if (!arg) continue;
          
          const text = String(arg).toLowerCase();
          
          // Vérifier chaque pattern
          for (const pattern of IGNORED_PATTERNS) {
            if (text.includes(pattern)) {
              return true;
            }
          }
          
          // Vérifier les URLs avec 401
          if (typeof arg === 'string' && (arg.includes('401') || arg.includes('unauthorized'))) {
            return true;
          }
          
          // Vérifier les objets avec status 401
          if (arg && typeof arg === 'object') {
            if (arg.status === 401 || arg.statusCode === 401) {
              return true;
            }
            if (arg.message && shouldIgnore(arg.message)) {
              return true;
            }
          }
        }
        
        return false;
      }
      
      // Intercepter console.error
      console.error = function(...args) {
        if (!shouldIgnore(...args)) {
          originalError.apply(console, args);
        }
      };
      
      // Intercepter console.warn
      console.warn = function(...args) {
        if (!shouldIgnore(...args)) {
          originalWarn.apply(console, args);
        }
      };
      
      // Intercepter window.onerror AVANT tout le reste
      const originalOnError = window.onerror;
      window.onerror = function(message, source, lineno, colno, error) {
        const messageStr = String(message || '').toLowerCase();
        const sourceStr = String(source || '').toLowerCase();
        
        // Vérifier plus agressivement les erreurs WebSocket
        if (shouldIgnore(messageStr, sourceStr, error) ||
            messageStr.includes('setupwebsocket') ||
            messageStr.includes('client:536') ||
            sourceStr.includes('client:536') ||
            sourceStr.includes('vite') ||
            (error && error.message && shouldIgnore(error.message))) {
          return true; // Empêcher complètement l'affichage
        }
        
        if (originalOnError) {
          return originalOnError.call(window, message, source, lineno, colno, error);
        }
        return false;
      };
      
      // Intercepter window.onunhandledrejection AVANT
      const originalUnhandledRejection = window.onunhandledrejection;
      window.onunhandledrejection = function(event) {
        const reasonStr = String(event.reason || '').toLowerCase();
        if (shouldIgnore(event.reason, reasonStr) ||
            reasonStr.includes('websocket') ||
            reasonStr.includes('setupwebsocket') ||
            reasonStr.includes('vite') ||
            reasonStr.includes('hmr')) {
          event.preventDefault();
          event.stopPropagation();
          return;
        }
        if (originalUnhandledRejection) {
          return originalUnhandledRejection.call(window, event);
        }
      };
      
      // Intercepter les erreurs d'événements avec useCapture pour intercepter plus tôt
      window.addEventListener('error', function(event) {
        const messageStr = String(event.message || '').toLowerCase();
        const filenameStr = String(event.filename || '').toLowerCase();
        if (shouldIgnore(event.message, event.filename, event.error) ||
            messageStr.includes('websocket') ||
            messageStr.includes('setupwebsocket') ||
            filenameStr.includes('client:536') ||
            filenameStr.includes('vite')) {
          event.preventDefault();
          event.stopPropagation();
          event.stopImmediatePropagation();
        }
      }, true); // useCapture = true pour intercepter plus tôt
      
      // Intercepter aussi unhandledrejection avec useCapture
      window.addEventListener('unhandledrejection', function(event) {
        const reasonStr = String(event.reason || '').toLowerCase();
        if (shouldIgnore(event.reason, reasonStr) ||
            reasonStr.includes('websocket') ||
            reasonStr.includes('setupwebsocket') ||
            reasonStr.includes('vite') ||
            reasonStr.includes('hmr')) {
          event.preventDefault();
          event.stopPropagation();
          event.stopImmediatePropagation();
        }
      }, true); // useCapture = true
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
