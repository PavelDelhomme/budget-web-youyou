<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Budget Annuel</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="alternate icon" href="/favicon.ico" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#3b82f6" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Budget" />
  
  <!-- Intercepteur global pour masquer les erreurs 401 et WebSocket AVANT que React ne charge -->
  <script>
    (function() {
      'use strict';
      
      // Sauvegarder les fonctions originales
      const originalError = console.error;
      const originalWarn = console.warn;
      const originalLog = console.log;
      
      // Patterns à ignorer (tous en minuscules pour comparaison)
      const IGNORED_PATTERNS = [
        '401',
        'unauthorized',
        'not authenticated',
        'websocket',
        'ws://',
        'hmr',
        'vite',
        'webpack',
        'failed to connect',
        'connection failed'
      ];
      
      function shouldIgnore(...args) {
        if (!args || args.length === 0) return false;
        
        // Convertir tous les arguments en string et vérifier
        for (const arg of args) {
          if (!arg) continue;
          
          const text = String(arg).toLowerCase();
          
          // Vérifier chaque pattern
          for (const pattern of IGNORED_PATTERNS) {
            if (text.includes(pattern)) {
              return true;
            }
          }
          
          // Vérifier les URLs avec 401
          if (typeof arg === 'string' && (arg.includes('401') || arg.includes('unauthorized'))) {
            return true;
          }
          
          // Vérifier les objets avec status 401
          if (arg && typeof arg === 'object') {
            if (arg.status === 401 || arg.statusCode === 401) {
              return true;
            }
            if (arg.message && shouldIgnore(arg.message)) {
              return true;
            }
          }
        }
        
        return false;
      }
      
      // Intercepter console.error
      console.error = function(...args) {
        if (!shouldIgnore(...args)) {
          originalError.apply(console, args);
        }
      };
      
      // Intercepter console.warn
      console.warn = function(...args) {
        if (!shouldIgnore(...args)) {
          originalWarn.apply(console, args);
        }
      };
      
      // Intercepter window.onerror
      const originalOnError = window.onerror;
      window.onerror = function(message, source, lineno, colno, error) {
        if (shouldIgnore(message, source, error)) {
          return true; // Empêcher l'affichage
        }
        if (originalOnError) {
          return originalOnError.call(window, message, source, lineno, colno, error);
        }
        return false;
      };
      
      // Intercepter window.onunhandledrejection
      window.addEventListener('unhandledrejection', function(event) {
        if (shouldIgnore(event.reason, String(event.reason))) {
          event.preventDefault();
          event.stopPropagation();
        }
      }, true);
      
      // Intercepter les erreurs d'événements
      window.addEventListener('error', function(event) {
        if (shouldIgnore(event.message, event.filename, event.error)) {
          event.preventDefault();
          event.stopPropagation();
        }
      }, true);
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
